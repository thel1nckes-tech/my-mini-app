<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MOGVAPE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121214;
            --card-sub-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --border-color: #222226;
            --nav-bg: #0d0d0f;
            --modal-bg: #121214;
        }

        body.light-theme {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --card-sub-bg: #e5e5ea;
            --text-color: #000000;
            --text-muted: #8e8e93;
            --border-color: #e5e5ea;
            --nav-bg: #ffffff;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
            user-select: none;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--bg-color);
            position: sticky; top: 0; z-index: 10;
        }
        .brand-name { font-size: 18px; font-weight: 700; }
        .location-select {
            background: var(--card-bg); color: var(--text-color);
            padding: 6px 14px; border-radius: 20px; font-size: 12px;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .page { display: none; padding: 0 16px; }
        .page.active { display: block; }

        .search-container { display: flex; gap: 8px; margin: 8px 0 14px; position: relative; }
        .search-box { position: relative; flex: 1; }
        .search-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 10px 14px 10px 36px; border-radius: 12px;
            color: var(--text-color); font-size: 14px; outline: none;
        }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-muted); }
        .sort-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px;
        }

        .categories-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; }
        .chip {
            background: var(--card-bg); color: var(--text-color);
            padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500;
            white-space: nowrap; border: 1px solid var(--border-color); cursor: pointer;
        }
        .chip.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .product-card {
            background: var(--card-bg); border-radius: 16px; padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative; border: 1px solid var(--border-color); cursor: pointer;
        }
        .product-img-wrap {
            position: relative; width: 100%; height: 140px;
            background: var(--card-sub-bg); border-radius: 12px; overflow: hidden; margin-bottom: 8px;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .strength-badge {
            position: absolute; top: 6px; right: 6px;
            background: var(--accent-blue); color: #fff;
            font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
        }
        .product-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; min-height: 32px; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--accent-blue); }

        /* Modal Overlay */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); z-index: 100;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: var(--modal-bg); width: 100%; max-height: 92vh;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 16px; overflow-y: auto; position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
            border-radius: 50%; background: var(--card-sub-bg); color: var(--text-color);
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            cursor: pointer; border: none; z-index: 5;
        }

        .modal-product-img { width: 100%; height: 220px; object-fit: contain; background: #000; border-radius: 14px; margin-bottom: 12px; }
        .modal-cat-badge { display: inline-block; background: var(--card-sub-bg); padding: 4px 10px; border-radius: 12px; font-size: 11px; color: var(--text-color); margin-bottom: 8px; }
        .modal-title-wrap { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .modal-product-title { font-size: 20px; font-weight: 700; }
        .fav-icon-btn { font-size: 20px; cursor: pointer; }
        .modal-product-price { font-size: 22px; font-weight: 700; color: var(--accent-blue); margin-bottom: 16px; }
        .section-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }

        .strength-chips { display: flex; gap: 8px; margin-bottom: 18px; }
        .s-chip { border: 2px solid var(--accent-blue); color: var(--text-color); padding: 10px 20px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; background: transparent; }
        .s-chip.active { background: transparent; color: #fff; }

        /* Carousel Flavors */
        .flavors-carousel { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .flavors-carousel::-webkit-scrollbar { display: none; }
        .flavor-card {
            min-width: 105px; width: 105px; height: 125px;
            background: var(--card-sub-bg); border-radius: 18px; padding: 8px;
            text-align: center; position: relative; border: 2px solid transparent; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .flavor-card.active { border-color: var(--accent-blue); }
        .flavor-card.disabled { opacity: 0.4; cursor: not-allowed; }
        .flavor-card img { width: 50px; height: 50px; object-fit: contain; margin-top: 4px; }
        .flavor-name { font-size: 11px; font-weight: 500; line-height: 1.2; margin-bottom: 4px; color: var(--text-color); }
        .check-badge {
            position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
            width: 22px; height: 22px; background: var(--accent-blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; font-weight: bold;
        }

        .btn-all-flavors {
            background: var(--accent-blue); color: #fff; border: none; padding: 4px 12px;
            border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px;
        }

        /* Cart Add & Quantity Controls */
        .btn-add-cart { width: 100%; background: var(--accent-blue); color: #fff; border: none; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .quantity-control-bar {
            display: none; width: 100%; background: var(--card-sub-bg); border-radius: 16px; padding: 8px 16px;
            margin-bottom: 16px; align-items: center; justify-content: space-between; border: 1px solid var(--border-color);
        }
        .quantity-control-bar.active { display: flex; }
        .qty-btn { background: transparent; border: none; color: var(--text-color); font-size: 20px; font-weight: 700; cursor: pointer; padding: 6px 12px; }
        .qty-val { font-size: 14px; font-weight: 600; }

        /* All Flavors Modal Grid */
        .all-flavors-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
        .all-flavor-card {
            background: var(--card-sub-bg); border-radius: 16px; padding: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            min-height: 130px; border: 2px solid transparent; cursor: pointer; position: relative; text-align: center;
        }
        .all-flavor-card.active { border-color: var(--accent-blue); background: #0f1c2e; }
        .all-flavor-card.disabled { opacity: 0.4; }
        .all-flavor-card img { width: 55px; height: 55px; object-fit: contain; }
        .all-flavor-name { font-size: 11px; font-weight: 600; margin-top: 6px; }
        .out-of-stock-text { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); display: flex; justify-content: space-around;
            padding: 8px 0 12px; border-top: 1px solid var(--border-color); z-index: 20;
        }
        .nav-item { color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; position: relative; }
        .nav-item .icon { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand-name">MOGVAPE</div>
        <div class="location-select">📍 Точка самовывоза ∨</div>
    </div>

    <div id="page-catalog" class="page active">
        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="Поиск товаров...">
            </div>
            <div class="sort-btn">⚙️</div>
        </div>

        <div class="categories-chips">
            <div class="chip active">Все товары</div>
            <div class="chip">Жидкость</div>
            <div class="chip">Расходник</div>
            <div class="chip">Одноразка</div>
        </div>

        <div class="products-grid" id="products-container"></div>
    </div>

    <!-- Modal 1: Product Detail -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-sheet">
            <button class="modal-close" onclick="closeProductModal()">✕</button>
            <img src="" id="m-img" class="modal-product-img" alt="Product">
            <div class="modal-cat-badge" id="m-cat">Жидкость</div>
            <div class="modal-title-wrap">
                <div class="modal-product-title" id="m-title">Isterika x Самоубийца V2</div>
                <div class="fav-icon-btn" id="fav-btn" onclick="toggleFav()">🤍</div>
            </div>
            <div class="modal-product-price" id="m-price">20.00 Б</div>

            <div class="section-label">Крепость</div>
            <div class="strength-chips" id="m-strengths"></div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div class="section-label" style="margin-bottom:0;">Вкус</div>
                <button class="btn-all-flavors" onclick="openAllFlavorsModal()">Все ❯</button>
            </div>

            <!-- Carousel of Flavors -->
            <div class="flavors-carousel" id="m-flavors-carousel"></div>

            <!-- Initial Add to Cart Button -->
            <button class="btn-add-cart" id="add-to-cart-btn" onclick="enableQuantityControl()">
                🛒 В корзину
            </button>

            <!-- Active Quantity Selector -->
            <div class="quantity-control-bar" id="qty-control-bar">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span class="qty-val"><span id="qty-num">1</span> шт</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: All Flavors Full Screen/Sheet Grid -->
    <div class="modal-overlay" id="all-flavors-modal" style="z-index:110;">
        <div class="modal-sheet" style="max-height: 95vh;">
            <button class="modal-close" onclick="closeAllFlavorsModal()">✕</button>
            
            <div class="search-container" style="margin-top:20px;">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="flavor-search-input" placeholder="Поиск..." oninput="filterFlavorsModal()">
                </div>
            </div>

            <div class="all-flavors-grid" id="all-flavors-container"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><div class="icon">📦</div><span>Ассортимент</span></div>
        <div class="nav-item"><div class="icon">🛒</div><span>Корзина</span></div>
        <div class="nav-item"><div class="icon">🤍</div><span>Избранное</span></div>
        <div class="nav-item"><div class="icon">👤</div><span>Профиль</span></div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const allFlavorsData = [
            { id: 1, name: 'Адреналин раш с лесными ягодами', available: true },
            { id: 2, name: 'Виноград дыня', available: true },
            { id: 3, name: 'Виноградная жвачка', available: true },
            { id: 4, name: 'Вишнёвый ментос', available: true },
            { id: 5, name: 'Двойной виноград', available: true },
            { id: 6, name: 'Киви энергетик', available: true },
            { id: 7, name: 'Клубника киви мята', available: true },
            { id: 8, name: 'Ментос смородина малина', available: true },
            { id: 9, name: 'Фанта виноград', available: true },
            { id: 10, name: 'Фруктовые мармеладки', available: true },
            { id: 11, name: 'Черника смородина', available: true },
            { id: 12, name: 'Виноград клубника', available: false }
        ];

        let selectedFlavorId = 1;
        let selectedProduct = null;
        let currentQty = 1;
        let isFav = false;

        const sampleProduct = {
            id: 1,
            title: 'Isterika x Самоубийца V2',
            category: 'Жидкость',
            price: 20.00,
            strength: '80 мг',
            img: 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=500'
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderMainProducts();
        });

        function renderMainProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = `
                <div class="product-card" onclick="openProductModal()">
                    <div class="product-img-wrap">
                        <div class="strength-badge">80 мг</div>
                        <img src="${sampleProduct.img}" class="product-img" alt="">
                    </div>
                    <div class="product-title">${sampleProduct.title}</div>
                    <div class="product-price">${sampleProduct.price.toFixed(2)} Б</div>
                </div>
                <div class="product-card">
                    <div class="product-img-wrap">
                        <div class="strength-badge">50 мг</div>
                        <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?w=500" class="product-img" alt="">
                    </div>
                    <div class="product-title">Catswill x Rick and Morty NEW</div>
                    <div class="product-price">15.00 Б</div>
                </div>
            `;
        }

        function openProductModal() {
            selectedProduct = sampleProduct;
            document.getElementById('m-img').src = selectedProduct.img;
            document.getElementById('m-title').innerText = selectedProduct.title;
            document.getElementById('m-price').innerText = `${selectedProduct.price.toFixed(2)} Б`;
            document.getElementById('m-strengths').innerHTML = `<button class="s-chip active">${selectedProduct.strength}</button>`;
            
            resetCartButton();
            renderFlavorsCarousel();
            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        function renderFlavorsCarousel() {
            const carousel = document.getElementById('m-flavors-carousel');
            carousel.innerHTML = '';

            allFlavorsData.forEach(f => {
                const card = document.createElement('div');
                const isSelected = f.id === selectedFlavorId;
                card.className = `flavor-card ${isSelected ? 'active' : ''} ${!f.available ? 'disabled' : ''}`;
                
                if (f.available) {
                    card.onclick = () => selectFlavor(f.id);
                }

                card.innerHTML = `
                    ${isSelected ? '<div class="check-badge">✓</div>' : ''}
                    <img src="${sampleProduct.img}" alt="">
                    <div class="flavor-name">${f.name}</div>
                `;
                carousel.appendChild(card);
            });
        }

        function selectFlavor(id) {
            selectedFlavorId = id;
            renderFlavorsCarousel();
            renderAllFlavorsGrid();
        }

        function enableQuantityControl() {
            document.getElementById('add-to-cart-btn').style.display = 'none';
            const qtyBar = document.getElementById('qty-control-bar');
            qtyBar.classList.add('active');
            currentQty = 1;
            document.getElementById('qty-num').innerText = currentQty;
        }

        function resetCartButton() {
            document.getElementById('add-to-cart-btn').style.display = 'flex';
            document.getElementById('qty-control-bar').classList.remove('active');
        }

        function changeQty(delta) {
            currentQty += delta;
            if (currentQty <= 0) {
                resetCartButton();
            } else {
                document.getElementById('qty-num').innerText = currentQty;
            }
        }

        function openAllFlavorsModal() {
            renderAllFlavorsGrid();
            document.getElementById('all-flavors-modal').classList.add('active');
        }

        function closeAllFlavorsModal() {
            document.getElementById('all-flavors-modal').classList.remove('active');
        }

        function renderAllFlavorsGrid(filterText = '') {
            const container = document.getElementById('all-flavors-container');
            container.innerHTML = '';

            const filtered = allFlavorsData.filter(f => f.name.toLowerCase().includes(filterText.toLowerCase()));

            filtered.forEach(f => {
                const card = document.createElement('div');
                const isSelected = f.id === selectedFlavorId;
                card.className = `all-flavor-card ${isSelected ? 'active' : ''} ${!f.available ? 'disabled' : ''}`;

                if (f.available) {
                    card.onclick = () => {
                        selectFlavor(f.id);
                        closeAllFlavorsModal();
                    };
                }

                card.innerHTML = `
                    ${isSelected ? '<div class="check-badge" style="top:6px; right:6px; left:auto; transform:none;">✓</div>' : ''}
                    <img src="${sampleProduct.img}" alt="">
                    <div class="all-flavor-name">${f.name}</div>
                    ${!f.available ? '<div class="out-of-stock-text">нет в наличии</div>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function filterFlavorsModal() {
            const query = document.getElementById('flavor-search-input').value;
            renderAllFlavorsGrid(query);
        }

        function toggleFav() {
            isFav = !isFav;
            document.getElementById('fav-btn').innerText = isFav ? '❤️' : '🤍';
        }
    </script>
</body>
</html>
