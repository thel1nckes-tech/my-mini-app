<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOGVAPE Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .title { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .price { color: #0088cc; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .btn-add {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }
        .cart-btn {
            background-color: #2ed573;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>💨 MOGVAPE Shop</h2>

    <div class="grid" id="catalog"></div>

    <div class="cart-bar">
        <div>Итого: <b id="total-price">0 BYN</b></div>
        <button class="cart-btn" id="order-btn" onclick="sendOrder()">Оформить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            { id: 1, title: "Жидкость Husky 30ml", price: 25 },
            { id: 2, title: "Жидкость Xylinet 30ml", price: 22 },
            { id: 3, title: "POD-система XROS 3", price: 95 },
            { id: 4, title: "Испаритель Vaporesso 0.6", price: 12 }
        ];

        let cart = {};

        function renderCatalog() {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            products.forEach(p => {
                const count = cart[p.id] ? cart[p.id].count : 0;
                container.innerHTML += `
                    <div class="card">
                        <div class="title">${p.title}</div>
                        <div class="price">${p.price} BYN</div>
                        <button class="btn-add" onclick="addToCart(${p.id})">
                            ${count > 0 ? 'Добавлено (' + count + ')' : 'В корзину'}
                        </button>
                    </div>
                `;
            });
            updateTotal();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!cart[id]) {
                cart[id] = { title: product.title, price: product.price, count: 1 };
            } else {
                cart[id].count++;
            }
            renderCatalog();
        }

        function updateTotal() {
            let total = 0;
            Object.values(cart).forEach(item => total += item.price * item.count);
            document.getElementById('total-price').innerText = total + ' BYN';
        }

        function sendOrder() {
            if (Object.keys(cart).length === 0) {
                alert('Корзина пуста!');
                return;
            }
            let orderText = "Ваш заказ MOGVAPE:\n";
            let total = 0;
            Object.values(cart).forEach(item => {
                orderText += `- ${item.title} x${item.count} (${item.price * item.count} BYN)\n`;
                total += item.price * item.count;
            });
            orderText += `\nИтого к оплате: ${total} BYN`;
            
            tg.sendData(orderText);
        }

        renderCatalog();
    </script>
</body>
</html>
