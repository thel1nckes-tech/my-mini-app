<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MOGVAPE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121214;
            --card-sub-bg: #1a1a1e;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-red: #ff3b30;
            --border-color: #222226;
            --nav-bg: #0d0d0f;
            --modal-bg: #121214;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
            user-select: none;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--bg-color);
            position: sticky; top: 0; z-index: 10;
        }
        .brand-name { font-size: 18px; font-weight: 700; }
        .location-select {
            background: var(--card-bg); color: var(--text-color);
            padding: 6px 14px; border-radius: 20px; font-size: 12px;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .page { display: none; padding: 0 16px; }
        .page.active { display: block; }

        .search-container { display: flex; gap: 8px; margin: 8px 0 14px; position: relative; }
        .search-box { position: relative; flex: 1; }
        .search-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 10px 14px 10px 36px; border-radius: 12px;
            color: var(--text-color); font-size: 14px; outline: none;
        }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-muted); }

        .categories-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
        .chip {
            background: var(--card-bg); color: var(--text-color);
            padding: 6px 14px; border-radius: 18px; font-size: 12px; font-weight: 500;
            white-space: nowrap; border: 1px solid var(--border-color); cursor: pointer;
        }
        .chip.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .product-card {
            background: var(--card-bg); border-radius: 16px; padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative; border: 1px solid var(--border-color); cursor: pointer;
        }
        .product-card.out-of-stock { opacity: 0.6; }
        .product-img-wrap {
            position: relative; width: 100%; height: 130px;
            background: var(--card-sub-bg); border-radius: 12px; overflow: hidden; margin-bottom: 8px;
        }
        .product-img { width: 100%; height: 100%; object-fit: contain; }
        .strength-badge {
            position: absolute; top: 6px; right: 6px;
            background: var(--accent-blue); color: #fff;
            font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
        }
        .out-badge {
            position: absolute; top: 6px; left: 6px;
            background: var(--accent-red); color: #fff;
            font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
        }
        .product-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; min-height: 32px; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--accent-blue); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); display: flex; justify-content: space-around;
            padding: 8px 0 12px; border-top: 1px solid var(--border-color); z-index: 20;
        }
        .nav-item { color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; position: relative; }
        .nav-item .icon { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent-blue); }
        .badge {
            position: absolute; top: -2px; right: 4px; background: var(--accent-blue);
            color: #fff; font-size: 9px; font-weight: 700; width: 14px; height: 14px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); z-index: 100;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: var(--modal-bg); width: 100%; max-height: 90vh;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 16px; overflow-y: auto; position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
            border-radius: 50%; background: var(--card-sub-bg); color: var(--text-color);
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            cursor: pointer; border: none; z-index: 5;
        }

        .user-header { display: flex; align-items: center; gap: 14px; margin: 16px 0 14px; }
        .user-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--card-sub-bg); }
        .user-name { font-size: 16px; font-weight: 700; }
        .user-id { font-size: 11px; color: var(--text-muted); }

        .profile-card-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 14px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; gap: 6px; cursor: pointer;
            text-decoration: none; color: inherit; margin-bottom: 8px;
        }
        .profile-card-btn.full-width { flex-direction: row; justify-content: flex-start; gap: 10px; }

        .modal-product-img { width: 100%; height: 200px; object-fit: contain; background: var(--card-sub-bg); border-radius: 14px; margin-bottom: 12px; }
        .modal-product-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .modal-product-price { font-size: 20px; font-weight: 700; color: var(--accent-blue); margin-bottom: 12px; }

        .flavors-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .flavor-card {
            background: var(--card-sub-bg); border-radius: 12px; padding: 6px;
            text-align: center; border: 1px solid transparent; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60px;
        }
        .flavor-card.active { border-color: var(--accent-blue); }
        .flavor-name { font-size: 10px; }

        .btn-add-cart { width: 100%; background: var(--accent-blue); color: #fff; border: none; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn-add-cart:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
        .btn-notify { width: 100%; background: var(--card-sub-bg); border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 10px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }

        .admin-form-input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 12px; color: var(--text-color); margin-bottom: 8px; font-size: 12px; outline: none; }
        
        .stock-toggle-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-sub-bg); padding: 10px; border-radius: 10px; margin-bottom: 6px; font-size: 12px;
        }
        .btn-stock-toggle {
            padding: 4px 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 11px; cursor: pointer;
        }
        .btn-stock-toggle.in { background: var(--accent-green); color: #fff; }
        .btn-stock-toggle.out { background: var(--accent-red); color: #fff; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand-name">MOGVAPE</div>
        <div class="location-select">📍 <span>Атриум</span></div>
    </div>

    <!-- Catalog Page -->
    <div id="page-catalog" class="page active">
        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="search-input" placeholder="Поиск по товарам и вкусам..." oninput="applyFilters()">
            </div>
        </div>

        <div class="categories-chips">
            <div class="chip active" onclick="filterCategory('all', this)">Все товары</div>
            <div class="chip" onclick="filterCategory('liquids', this)">Жидкость</div>
            <div class="chip" onclick="filterCategory('disposables', this)">Одноразка</div>
        </div>

        <div class="products-grid" id="products-container"></div>
    </div>

    <!-- Cart Page -->
    <div id="page-cart" class="page">
        <h3 style="margin-top:16px; margin-bottom:12px;">Корзина</h3>
        <div id="cart-items-list"></div>
        <button class="btn-add-cart" style="margin-top:16px;" onclick="checkoutOrder()">Оформить заказ</button>
    </div>

    <!-- Profile Page -->
    <div id="page-profile" class="page">
        <div class="user-header">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="user-avatar" alt="Avatar">
            <div>
                <div class="user-name">Менеджер</div>
                <div class="user-id" id="user-display-id">ID: 5995285721</div>
            </div>
        </div>

        <div id="admin-panel-btn-wrap" style="display:none;">
            <div class="profile-card-btn full-width" style="border-color: var(--accent-blue); background: rgba(0,122,255,0.1);" onclick="openAdminModal()">
                <span style="font-size: 20px;">🛠</span>
                <div style="text-align: left;">
                    <div style="font-size:13px; font-weight:600; color:var(--accent-blue);">Админ-панель</div>
                    <div style="font-size:11px; color:var(--text-muted);">Добавление товаров и остатки</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-sheet">
            <button class="modal-close" onclick="closeProductModal()">✕</button>
            <img src="" id="m-img" class="modal-product-img" alt="Product">
            <div class="modal-product-title" id="m-title">Название</div>
            <div class="modal-product-price" id="m-price">0.00 Б</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Выберите вкус</div>
            <div class="flavors-grid" id="m-flavors"></div>

            <button class="btn-add-cart" id="m-add-btn" onclick="addToCart()">🛒 В корзину</button>
            <button class="btn-notify" id="m-notify-btn" style="display:none;" onclick="subscribeStockNotification()">🔔 Сообщить о поступлении</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-sheet">
            <button class="modal-close" onclick="closeAdminModal()">✕</button>
            <h3 style="font-size:16px; margin-bottom:12px; text-align:center;">Управление товарами</h3>
            
            <div style="font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--accent-blue);">Управление остатками</div>
            <div id="admin-stock-list" style="max-height: 150px; overflow-y: auto; margin-bottom: 12px;"></div>

            <div style="font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--accent-blue);">Добавить новый товар</div>
            <input type="text" id="adm-title" class="admin-form-input" placeholder="Название товара">
            <select id="adm-cat" class="admin-form-input">
                <option value="liquids">Жидкость</option>
                <option value="disposables">Одноразка</option>
            </select>
            <input type="number" id="adm-price" class="admin-form-input" placeholder="Цена (Б)">
            <input type="text" id="adm-strength" class="admin-form-input" placeholder="Крепость">
            <input type="text" id="adm-img" class="admin-form-input" placeholder="Ссылка на фото">
            <input type="text" id="adm-flavors" class="admin-form-input" placeholder="Вкусы через запятую">
            
            <button class="btn-add-cart" style="margin-top:8px;" onclick="addNewProductFromAdmin()">Опубликовать товар</button>
        </div>
    </div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('catalog')" id="nav-catalog">
            <div class="icon">📦</div><span>Каталог</span>
        </div>
        <div class="nav-item" onclick="switchPage('cart')" id="nav-cart">
            <div class="icon">🛒</div><div class="badge" id="cart-badge">0</div><span>Корзина</span>
        </div>
        <div class="nav-item" onclick="switchPage('profile')" id="nav-profile">
            <div class="icon">👤</div><span>Профиль</span>
        </div>
    </div>

    <script>
        const ADMIN_ID = 5995285721;
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let currentCategory = 'all';
        let selectedProduct = null;
        let selectedFlavor = null;

        let products = JSON.parse(localStorage.getItem('mogvape_custom_products') || 'null') || [
            {
                id: 1,
                title: 'Isterika x Самоубийца V2',
                category: 'liquids',
                price: 20.00,
                strength: '80 мг',
                inStock: true,
                img: 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400',
                flavors: [{ name: 'Адреналин раш' }, { name: 'Виноград дыня' }]
            },
            {
                id: 2,
                title: 'Catswill x Rick and Morty NEW',
                category: 'liquids',
                price: 15.00,
                strength: '50 мг',
                inStock: false,
                img: 'https://images.unsplash.com/photo-1539185441755-769473a23570?w=400',
                flavors: [{ name: 'Классический микс' }]
            }
        ];

        let cart = JSON.parse(localStorage.getItem('mogvape_cart') || '[]');

        window.addEventListener('DOMContentLoaded', () => {
            initUserData();
            applyFilters();
            updateCartUI();
        });

        function initUserData() {
            let tgUser = tg?.initDataUnsafe?.user;
            let currentUserId = tgUser ? tgUser.id : ADMIN_ID;
            document.getElementById('user-display-id').innerText = `ID: ${currentUserId}`;
            if (currentUserId === ADMIN_ID) {
                document.getElementById('admin-panel-btn-wrap').style.display = 'block';
            }
        }

        function saveProducts() {
            localStorage.setItem('mogvape_custom_products', JSON.stringify(products));
        }

        function applyFilters() {
            let result = [...products];
            const search = document.getElementById('search-input').value.toLowerCase().trim();

            if (currentCategory !== 'all') {
                result = result.filter(p => p.category === currentCategory);
            }

            if (search) {
                result = result.filter(p => p.title.toLowerCase().includes(search));
            }

            renderProducts(result, 'products-container');
        }

        function filterCategory(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.categories-chips .chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            applyFilters();
        }

        function renderProducts(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            items.forEach(prod => {
                const card = document.createElement('div');
                card.className = `product-card ${!prod.inStock ? 'out-of-stock' : ''}`;
                card.onclick = () => openProductModal(prod);
                card.innerHTML = `
                    <div class="product-img-wrap">
                        ${!prod.inStock ? '<div class="out-badge">Нет в наличии</div>' : ''}
                        ${prod.strength ? `<div class="strength-badge">${prod.strength}</div>` : ''}
                        <img src="${prod.img}" class="product-img" alt="${prod.title}">
                    </div>
                    <div class="product-title">${prod.title}</div>
                    <div class="product-price">${prod.price.toFixed(2)} Б</div>
                `;
                container.appendChild(card);
            });
        }

        function openProductModal(prod) {
            selectedProduct = prod;
            selectedFlavor = prod.flavors?.[0]?.name || 'Стандартный';
            document.getElementById('m-img').src = prod.img;
            document.getElementById('m-title').innerText = prod.title;
            document.getElementById('m-price').innerText = `${prod.price.toFixed(2)} Б`;

            const addBtn = document.getElementById('m-add-btn');
            const notifyBtn = document.getElementById('m-notify-btn');

            if (!prod.inStock) {
                addBtn.style.display = 'none';
                notifyBtn.style.display = 'block';
            } else {
                addBtn.style.display = 'block';
                notifyBtn.style.display = 'none';
            }

            const fBox = document.getElementById('m-flavors');
            fBox.innerHTML = '';
            prod.flavors.forEach((f, idx) => {
                const fCard = document.createElement('div');
                fCard.className = `flavor-card ${idx === 0 ? 'active' : ''}`;
                fCard.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.flavor-card').forEach(fc => fc.classList.remove('active'));
                    fCard.classList.add('active');
                    selectedFlavor = f.name;
                };
                fCard.innerHTML = `<div class="flavor-name">${f.name}</div>`;
                fBox.appendChild(fCard);
            });

            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() { document.getElementById('product-modal').classList.remove('active'); }
        
        function openAdminModal() {
            renderAdminStockList();
            document.getElementById('admin-modal').classList.add('active');
        }
        function closeAdminModal() { document.getElementById('admin-modal').classList.remove('active'); }

        function renderAdminStockList() {
            const list = document.getElementById('admin-stock-list');
            list.innerHTML = '';
            products.forEach(p => {
                const item = document.createElement('div');
                item.className = 'stock-toggle-item';
                item.innerHTML = `
                    <span>${p.title}</span>
                    <button class="btn-stock-toggle ${p.inStock ? 'in' : 'out'}" onclick="toggleStockStatus(${p.id})">
                        ${p.inStock ? 'В наличии' : 'Нет на складе'}
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function toggleStockStatus(id) {
            const prod = products.find(p => p.id === id);
            if (prod) {
                prod.inStock = !prod.inStock;
                saveProducts();
                renderAdminStockList();
                applyFilters();
            }
        }

        function subscribeStockNotification() {
            alert(`Заявка принята! Сообщим вам, когда "${selectedProduct.title}" появиться в наличии.`);
            closeProductModal();
        }

        function addNewProductFromAdmin() {
            const title = document.getElementById('adm-title').value.trim();
            const cat = document.getElementById('adm-cat').value;
            const price = parseFloat(document.getElementById('adm-price').value);
            const strength = document.getElementById('adm-strength').value.trim();
            const img = document.getElementById('adm-img').value.trim() || 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400';
            const flavorsRaw = document.getElementById('adm-flavors').value.split(',');

            if (!title || !price) {
                alert('Заполните название и цену!');
                return;
            }

            const newProd = {
                id: Date.now(),
                title: title,
                category: cat,
                price: price,
                strength: strength,
                inStock: true,
                img: img,
                flavors: flavorsRaw.map(f => ({ name: f.trim() })).filter(f => f.name.length > 0)
            };

            products.push(newProd);
            saveProducts();
            applyFilters();
            closeAdminModal();
            alert('Товар добавлен!');
        }

        function addToCart() {
            if (selectedProduct && selectedProduct.inStock) {
                cart.push({ title: selectedProduct.title, flavor: selectedFlavor, price: selectedProduct.price });
                localStorage.setItem('mogvape_cart', JSON.stringify(cart));
                updateCartUI();
                closeProductModal();
                switchPage('cart');
            }
        }

        function updateCartUI() {
            document.getElementById('cart-badge').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            cart.forEach((item) => {
                const el = document.createElement('div');
                el.style.cssText = 'background:var(--card-bg); border:1px solid var(--border-color); padding:10px; border-radius:12px; margin-bottom:6px; font-size:13px;';
                el.innerText = `${item.title} (${item.flavor}) - ${item.price} Б`;
                list.appendChild(el);
            });
        }

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.getElementById(`nav-${pageName}`).classList.add('active');
        }
    </script>
</body>
</html>
