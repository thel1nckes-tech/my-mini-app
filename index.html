<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOGVAPE Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .title { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .price { color: #0088cc; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .btn {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .btn-danger {
            background-color: #ff3b30;
        }
        .admin-panel {
            background: #1e1e1e;
            border: 2px dashed #0088cc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .admin-panel input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <h2>MOGVAPE Каталог</h2>

    <!-- Панель администратора (скрыта для обычных пользователей) -->
    <div id="admin-section" class="admin-panel">
        <h3 style="margin-top:0; text-align:center; color:#0088cc;">🛠 Панель администратора</h3>
        <input type="text" id="prod-name" placeholder="Название товара">
        <input type="number" id="prod-price" placeholder="Цена (руб)">
        <button class="btn" onclick="addProduct()">Добавить товар</button>
    </div>
    
    <!-- Сетка товаров -->
    <div class="grid" id="product-list">
        <p style="text-align: center; grid-column: span 2;">Загрузка товаров...</p>
    </div>

    <!-- Нижняя панель -->
    <div class="cart-bar">
        <span id="cart-info">Корзина пуста</span>
        <button class="btn" style="width: auto; padding: 8px 16px;" onclick="checkout()">Оформить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = "http://159.194.229.150:8000";
        let isAdmin = false;
        let cart = [];

        // Проверка прав администратора при открытии
        async function checkAdminRights() {
            const user = tg.initDataUnsafe?.user;
            if (!user) return;

            try {
                const res = await fetch(`${API_URL}/api/is-admin/${user.id}`);
                const data = await res.json();
                if (data.is_admin) {
                    isAdmin = true;
                    document.getElementById('admin-section').style.display = 'block';
                }
            } catch (e) {
                console.error("Ошибка проверки админа:", e);
            }
        }

        // Загрузка товаров
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const products = await response.json();
                
                const container = document.getElementById('product-list');
                container.innerHTML = '';

                if (products.length === 0) {
                    container.innerHTML = '<p style="text-align: center; grid-column: span 2;">Товаров пока нет</p>';
                    return;
                }

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let deleteBtn = '';
                    if (isAdmin) {
                        deleteBtn = `<button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Удалить</button>`;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="title">${p.name}</div>
                            <div class="price">${p.price} ₽</div>
                        </div>
                        <div>
                            <button class="btn" onclick="addToCart('${p.id}', '${p.name}', ${p.price})">В корзину</button>
                            ${deleteBtn}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                document.getElementById('product-list').innerHTML = '<p style="text-align: center; grid-column: span 2; color: red;">Ошибка связи с сервером</p>';
            }
        }

        // Добавление товара (только для админа)
        async function addProduct() {
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);

            if (!name || !price) {
                tg.showAlert("Заполните название и цену!");
                return;
            }

            const newProduct = {
                id: 'prod_' + Date.now(),
                name: name,
                category: 'vape',
                price: price,
                stock: 10,
                description: '',
                options: '[]',
                image: '',
                created: Date.now()
            };

            try {
                const res = await fetch(`${API_URL}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                if (res.ok) {
                    document.getElementById('prod-name').value = '';
                    document.getElementById('prod-price').value = '';
                    tg.showAlert("Товар успешно добавлен!");
                    loadProducts();
                } else {
                    tg.showAlert("Ошибка при добавлении товара");
                }
            } catch (e) {
                tg.showAlert("Ошибка соединения с сервером");
            }
        }

        // Удаление товара (только для админа)
        async function deleteProduct(id) {
            if (!confirm("Точно удалить этот товар?")) return;

            try {
                const res = await fetch(`${API_URL}/api/products/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    loadProducts();
                } else {
                    tg.showAlert("Не удалось удалить товар");
                }
            } catch (e) {
                tg.showAlert("Ошибка соединения");
            }
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            updateCartBar();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function updateCartBar() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const cartInfo = document.getElementById('cart-info');
            if (cart.length === 0) {
                cartInfo.innerText = "Корзина пуста";
            } else {
                cartInfo.innerText = `${cart.length} тов. на ${total} ₽`;
            }
        }

        async function checkout() {
            if (cart.length === 0) {
                tg.showAlert("Корзина пуста!");
                return;
            }

            const user = tg.initDataUnsafe?.user;
            const customerName = user ? (user.username ? `@${user.username}` : user.first_name) : "Гость";
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const itemsList = cart.map(i => `- ${i.name} (${i.price} ₽)`).join('\n');

            const orderData = {
                customer: customerName,
                phone: "Telegram WebApp",
                total: total,
                items: itemsList,
                status: "Новый",
                date: new Date().toLocaleString()
            };

            try {
                const res = await fetch(`${API_URL}/api/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (res.ok) {
                    tg.showAlert("Заказ успешно оформлен! Ожидайте уведомления.");
                    cart = [];
                    updateCartBar();
                } else {
                    tg.showAlert("Ошибка при оформлении заказа.");
                }
            } catch (e) {
                tg.showAlert("Нет связи с сервером.");
            }
        }

        // Инициализация при старте
        checkAdminRights().then(() => {
            loadProducts();
        });
    </script>
</body>
</html>
