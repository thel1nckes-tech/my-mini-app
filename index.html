<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VapeApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16171d;
            --card-sub-bg: #1f2029;
            --text-color: #ffffff;
            --text-muted: #8c8e9b;
            --accent-blue: #2f80ed;
            --accent-green: #2ebd59;
            --border-color: #252732;
            --nav-bg: #121319;
            --modal-bg: #14151b;
        }

        /* Светлая тема */
        body.light-theme {
            --bg-color: #f2f3f7;
            --card-bg: #ffffff;
            --card-sub-bg: #eef0f5;
            --text-color: #111111;
            --text-muted: #6e717d;
            --border-color: #e2e4ec;
            --nav-bg: #ffffff;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            transition: background-color 0.2s, color 0.2s;
            user-select: none;
        }

        /* Шапка */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand-name { font-size: 18px; font-weight: 800; }
        .location-select {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        /* Страницы */
        .page { display: none; padding: 0 16px; }
        .page.active { display: block; }

        /* Профиль */
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .user-info { display: flex; align-items: center; gap: 14px; }
        .avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: #2a2b32;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
